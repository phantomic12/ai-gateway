# Builds the container image on every push/PR, and publishes it to the GitHub
# Container Registry (GHCR) on main and on version tags.
#
# Auth uses the workflow's built-in GITHUB_TOKEN — no repository secrets are
# required. `packages: write` is the only extra permission needed.
#
# Images:
#   ghcr.io/<owner>/ai-gateway:latest          (main)
#   ghcr.io/<owner>/ai-gateway:sha-<short>     (every push)
#   ghcr.io/<owner>/ai-gateway:<version>       (v* tags, plus major/minor aliases)
#
# Pull (packages default to private on first push — flip visibility in
# Package settings if you want anonymous pulls):
#   docker pull ghcr.io/<owner>/ai-gateway:latest

name: Docker

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build / publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only log in for pushes. PRs from forks get a read-only token, so
      # attempting a login there would fail the job for no benefit.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
